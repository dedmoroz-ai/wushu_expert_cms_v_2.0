# Отчёты аналитики публично не раздаются (замечание заказчика 05.10.2026).
# Файлы лежат в storage/app/public/reports/, открываются только авторизованными
# пользователями через Laravel-маршрут /reports/{файл} (routes/web.php, auth).
# Продублировано в Caddyfile (внешний контур) и в Dockerfile (пересборки образа).
location ^~ /storage/reports/ {
    return 404;
}

location = /storage/reports {
    return 404;
}
